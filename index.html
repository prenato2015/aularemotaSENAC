<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário HTML & CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .question-container {
            display: none;
        }

        .question-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .option.wrong {
            border-color: #f44336;
            background: #ffebee;
        }

        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background: #4caf50;
            color: white;
        }

        .option.wrong .option-letter {
            background: #f44336;
            color: white;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct-feedback {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            color: #2e7d32;
        }

        .feedback.wrong-feedback {
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
        }

        .feedback h3 {
            margin-bottom: 10px;
        }

        .next-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .result-container {
            display: none;
            text-align: center;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }

        .result-name {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }

        .stat-box {
            padding: 20px;
            border-radius: 15px;
            min-width: 120px;
        }

        .stat-box.correct-stat {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .stat-box.wrong-stat {
            background: #ffebee;
            color: #c62828;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            margin-top: 5px;
        }

        .datetime {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .restart-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tela de Cadastro -->
        <div id="registerScreen">
            <h1>📝 HTML & CSS - AULA REMOTA 22/04/2026</h1>
            <p class="subtitle">Testando seus conhecimentos em desenvolvimento web</p>

            <div class="form-group">
                <label for="studentName">Nome do Aluno:</label>
                <input type="text" id="studentName" placeholder="Digite seu nome completo">
            </div>

            <button class="btn" onclick="startQuiz()">Iniciar Questionário</button>
        </div>

        <!-- Tela de Questões -->
        <div id="quizScreen" class="question-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <span class="question-number" id="questionNumber"></span>
            <div class="question-text" id="questionText"></div>

            <div class="options" id="optionsContainer"></div>

            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Próxima Questão →</button>
        </div>

        <!-- Tela de Resultados -->
        <div id="resultScreen" class="result-container">
            <div class="result-icon">🏆</div>
            <h2 class="result-title">Questionário Finalizado!</h2>
            <div class="result-name" id="resultName"></div>
            <div class="datetime" id="resultDateTime"></div>

            <div class="score-circle" id="scoreCircle"></div>

            <div class="stats">
                <div class="stat-box correct-stat">
                    <div class="stat-number" id="correctCount">0</div>
                    <div class="stat-label">Acertos ✅</div>
                </div>
                <div class="stat-box wrong-stat">
                    <div class="stat-number" id="wrongCount">0</div>
                    <div class="stat-label">Erros ❌</div>
                </div>
            </div>

            <div id="finalMessage"></div>
            /* A opção de refazer o questionário pode ser habilitada se desejado
           <!-- <button class="restart-btn" onclick="restartQuiz()">Refazer Questionário</button>-->
        </div>
    </div>

    <script>
        // Banco de questões (10 HTML + 10 CSS)
        const questions = [
            // HTML Questions (1-10)
            {
                question: "Qual tag HTML é usada para definir o título de uma página que aparece na aba do navegador?",
                options: ["&lt;header&gt;", "&lt;title&gt;", "&lt;head&gt;", "&lt;meta&gt;"],
                correct: 1,
                explanation: "A tag &lt;title&gt; define o título da página que é exibido na aba do navegador e nos resultados de busca."
            },
            {
                question: "Qual atributo HTML é usado para definir um link que abre em uma nova aba?",
                options: ["target='_blank'", "rel='new'", "href='_new'", "open='new'"],
                correct: 0,
                explanation: "O atributo target='_blank' faz com que o link seja aberto em uma nova aba ou janela do navegador."
            },
            {
                question: "Qual tag é usada para criar uma lista ordenada em HTML?",
                options: ["&lt;ul&gt;", "&lt;list&gt;", "&lt;ol&gt;", "&lt;li&gt;"],
                correct: 2,
                explanation: "A tag &lt;ol&gt; (ordered list) cria uma lista com numeração automática (1, 2, 3...)."
            },
            {
                question: "Qual é a tag semântica correta para o conteúdo principal de uma página?",
                options: ["&lt;div&gt;", "&lt;section&gt;", "&lt;main&gt;", "&lt;content&gt;"],
                correct: 2,
                explanation: "A tag &lt;main&gt; representa o conteúdo principal e único da página, melhorando a acessibilidade."
            },
            {
                question: "Como se cria um campo de entrada de texto em um formulário HTML?",
                options: ["&lt;input type='text'&gt;", "&lt;text&gt;", "&lt;field type='text'&gt;", "&lt;input text&gt;"],
                correct: 0,
                explanation: "&lt;input type='text'&gt; é a forma correta de criar um campo de texto em formulários HTML."
            },
            {
                question: "Qual tag HTML5 é usada para reproduzir vídeo nativamente?",
                options: ["&lt;movie&gt;", "&lt;media&gt;", "&lt;video&gt;", "&lt;play&gt;"],
                correct: 2,
                explanation: "A tag &lt;video&gt; permite incorporar vídeos diretamente na página sem plugins externos."
            },
            {
                question: "Qual atributo da tag &lt;img&gt; é obrigatório para acessibilidade e SEO?",
                options: ["title", "src", "alt", "description"],
                correct: 2,
                explanation: "O atributo 'alt' fornece texto alternativo para leitores de tela e quando a imagem não carrega."
            },
            {
                question: "Qual tag cria uma quebra de linha em HTML?",
                options: ["&lt;lb&gt;", "&lt;break&gt;", "&lt;br&gt;", "&lt;newline&gt;"],
                correct: 2,
                explanation: "&lt;br&gt; é uma tag vazia que insere uma quebra de linha simples no texto."
            },
            {
                question: "Qual elemento HTML define a estrutura de uma tabela?",
                options: ["&lt;table&gt;, &lt;tr&gt;, &lt;td&gt;", "&lt;grid&gt;, &lt;row&gt;, &lt;col&gt;", "&lt;tab&gt;, &lt;line&gt;, &lt;cell&gt;", "&lt;table&gt;, &lt;row&gt;, &lt;column&gt;"],
                correct: 0,
                explanation: "&lt;table&gt; define a tabela, &lt;tr&gt; define uma linha e &lt;td&gt; define uma célula de dados."
            },
            {
                question: "Qual tag HTML é usada para incluir folhas de estilo CSS externas?",
                options: ["&lt;style&gt;", "&lt;css&gt;", "&lt;link&gt;", "&lt;script&gt;"],
                correct: 2,
                explanation: "A tag &lt;link rel='stylesheet' href='...'&gt; conecta arquivos CSS externos ao documento HTML."
            },
            // CSS Questions (11-20)
            {
                question: "Qual propriedade CSS altera a cor do texto?",
                options: ["text-color", "font-color", "color", "foreground"],
                correct: 2,
                explanation: "A propriedade 'color' define a cor do texto de um elemento."
            },
            {
                question: "Qual seletor CSS tem maior especificidade?",
                options: [".classe", "#id", "elemento", "*"],
                correct: 1,
                explanation: "IDs (#id) têm especificidade maior que classes, elementos e seletor universal."
            },
            {
                question: "Qual propriedade CSS cria espaço INTERNO entre o conteúdo e a borda?",
                options: ["margin", "padding", "border-spacing", "gap"],
                correct: 1,
                explanation: "'padding' cria espaço interno, enquanto 'margin' cria espaço externo ao elemento."
            },
            {
                question: "Qual valor de display faz um elemento ocupar toda a largura disponível?",
                options: ["inline", "flex", "block", "none"],
                correct: 2,
                explanation: "Elementos 'block' ocupam 100% da largura disponível e iniciam em nova linha."
            },
            {
                question: "Qual propriedade CSS centraliza um elemento horizontalmente com margin?",
                options: ["margin: center", "margin: 0 auto", "align: center", "margin: auto 0"],
                correct: 1,
                explanation: "'margin: 0 auto' centraliza horizontalmente elementos com largura definida."
            },
            {
                question: "Qual propriedade define a ordem de empilhamento de elementos sobrepostos?",
                options: ["stack-order", "z-index", "layer", "position"],
                correct: 1,
                explanation: "'z-index' controla a profundidade dos elementos; valores maiores ficam na frente."
            },
            {
                question: "Qual unidade CSS é relativa ao tamanho da fonte do elemento pai?",
                options: ["px", "vw", "em", "rem"],
                correct: 2,
                explanation: "'em' é relativo ao tamanho da fonte do elemento pai, enquanto 'rem' é relativo ao root."
            },
            {
                question: "Qual propriedade CSS torna um elemento invisível mas mantém seu espaço no layout?",
                options: ["display: none", "visibility: hidden", "opacity: 0", "hidden: true"],
                correct: 1,
                explanation: "'visibility: hidden' oculta o elemento mas preserva o espaço que ele ocuparia."
            },
            {
                question: "Qual propriedade CSS cria um layout em grade bidimensional?",
                options: ["flexbox", "grid", "table", "columns"],
                correct: 1,
                explanation: "CSS Grid Layout cria layouts bidimensionais com linhas e colunas simultaneamente."
            },
            {
                question: "Qual pseudo-classe CSS aplica estilo ao passar o mouse sobre um elemento?",
                options: [":active", ":focus", ":hover", ":mouseover"],
                correct: 2,
                explanation: ":hover aplica estilos quando o cursor do mouse está sobre o elemento."
            }
        ];

        let currentQuestion = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let studentName = "";
        let startDateTime = "";
        let answered = false;

        function startQuiz() {
            const nameInput = document.getElementById('studentName');
            if (!nameInput.value.trim()) {
                alert("Por favor, digite seu nome para iniciar!");
                return;
            }

            studentName = nameInput.value.trim();
            const now = new Date();
            startDateTime = now.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            document.getElementById('registerScreen').classList.add('hidden');
            document.getElementById('quizScreen').style.display = 'block';

            showQuestion();
        }

        function showQuestion() {
            answered = false;
            const question = questions[currentQuestion];

            document.getElementById('questionNumber').textContent = 
                `Questão ${currentQuestion + 1} de ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerHTML = `
                    <span class="option-letter">${letters[index]}</span>
                    <span>${option}</span>
                `;
                optionDiv.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(optionDiv);
            });

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').style.display = 'none';

            updateProgressBar();
        }

        function selectAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const question = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const letters = ['A', 'B', 'C', 'D'];

            options.forEach((option, index) => {
                option.style.pointerEvents = 'none';
                if (index === question.correct) {
                    option.classList.add('correct');
                } else if (index === selectedIndex && index !== question.correct) {
                    option.classList.add('wrong');
                }
            });

            const feedback = document.getElementById('feedback');

            if (selectedIndex === question.correct) {
                correctAnswers++;
                feedback.className = 'feedback correct-feedback';
                feedback.innerHTML = `
                    <h3>✅ Resposta Correta!</h3>
                    <p>${question.explanation}</p>
                `;
            } else {
                wrongAnswers++;
                feedback.className = 'feedback wrong-feedback';
                feedback.innerHTML = `
                    <h3>❌ Resposta Incorreta!</h3>
                    <p><strong>A resposta correta é a opção ${letters[question.correct]}:</strong> ${question.options[question.correct]}</p>
                    <p>${question.explanation}</p>
                `;
            }

            feedback.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function updateProgressBar() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';

            const percentage = Math.round((correctAnswers / questions.length) * 100);

            document.getElementById('resultName').textContent = `Aluno: ${studentName}`;
            document.getElementById('resultDateTime').textContent = `Realizado em: ${startDateTime}`;
            document.getElementById('scoreCircle').textContent = `${percentage}%`;
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('wrongCount').textContent = wrongAnswers;

            let message = "";
            if (percentage >= 90) {
                message = "🌟 Excelente! Você domina HTML e CSS!";
                document.querySelector('.result-icon').textContent = "🏆";
            } else if (percentage >= 70) {
                message = "👏 Muito bom! Você tem um ótimo conhecimento!";
                document.querySelector('.result-icon').textContent = "🎖️";
            } else if (percentage >= 50) {
                message = "📚 Bom! Mas ainda há espaço para melhorar.";
                document.querySelector('.result-icon').textContent = "📖";
            } else {
                message = "💪 Continue estudando! Pratique mais HTML e CSS.";
                document.querySelector('.result-icon').textContent = "🎯";
            }

            document.getElementById('finalMessage').innerHTML = `<h3 style="color: #667eea; margin-top: 10px;">${message}</h3>`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            correctAnswers = 0;
            wrongAnswers = 0;
            studentName = "";
            startDateTime = "";
            answered = false;

            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('registerScreen').classList.remove('hidden');
            document.getElementById('studentName').value = '';
        }

        // Permitir iniciar com Enter
        document.getElementById('studentName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startQuiz();
            }
        });
    </script>
</body>
</html>
