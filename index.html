<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário - SENAC DF</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #0f172a;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--secondary-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.2) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(56, 189, 248, 0.1) 0, transparent 50%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
        }

        h1 { font-size: 1.4rem; margin: 0; color: var(--accent-color); }
        h2 { font-size: 1rem; font-weight: normal; margin: 5px 0; opacity: 0.8; }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .quiz-area { display: none; }

        .question {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #e2e8f0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #334155;
            text-align: left;
            padding: 15px;
            border: 1px solid transparent;
        }

        .option-btn:hover {
            background: #475569;
        }

        #feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        .correct { background-color: var(--success) !important; }
        .wrong { background-color: var(--error) !important; }

        #results { display: none; text-align: center; }
        .stat-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AULA REMOTA - CURSO TÉCNICO EM DESENVOLVIMENTO DE SISTEMA - SENAC-DF</h1>
        <h2>Instrutor: Pedro Renato | 29/04/2026</h2>
    </div>

    <!-- Tela de Login -->
    <div id="login-screen" class="input-group">
        <p>Bem-vindo! Identifique-se para começar o questionário técnico.</p>
        <input type="text" id="student-name" placeholder="Digite seu nome completo">
        <br><br>
        <button onclick="startQuiz()">Iniciar Questionário</button>
    </div>

    <!-- Área do Quiz -->
    <div id="quiz-area" class="quiz-area">
        <div id="quiz-header" style="font-size: 0.9rem; margin-bottom: 10px; color: var(--accent-color);"></div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div id="feedback"></div>
        <div style="text-align: right; margin-top: 1rem;">
            <button id="next-btn" style="display: none;" onclick="nextQuestion()">Próxima Questão</button>
        </div>
    </div>

    <!-- Tela de Resultados -->
    <div id="results">
        <h3>Avaliação Concluída</h3>
        <div id="result-summary"></div>
        <div class="stat-box">
            <div style="background: rgba(34, 197, 94, 0.2); padding: 10px; border-radius: 8px;">
                <span id="correct-count"></span> Acertos
            </div>
            <div style="background: rgba(239, 68, 68, 0.2); padding: 10px; border-radius: 8px;">
                <span id="error-count"></span> Erros
            </div>
        </div>
        <button onclick="location.reload()">Reiniciar</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Qual a principal característica de uma <div> no HTML?", o: ["Elemento Inline", "Elemento Block-level", "Somente para textos", "Não aceita CSS"], a: 1 },
        { q: "Para que serve a tag <span>?", o: ["Para criar parágrafos", "Para quebras de linha", "Para aplicar estilos em partes específicas de um texto (inline)", "Para criar tabelas"], a: 2 },
        { q: "Qual o uso correto de uma DIV?", o: ["Agrupar elementos para layout e estrutura", "Substituir a tag <body>", "Apenas para inserir imagens", "Somente para rodapés"], a: 0 },
        { q: "Por que as tags semânticas são preferíveis a DIVs genéricas quando possível?", o: ["DIVs não funcionam no Chrome", "Para acessibilidade e melhor indexação (SEO)", "DIVs são mais lentas", "CSS não funciona em DIVs"], a: 1 },
        { q: "O SPAN altera o fluxo natural do texto por padrão?", o: ["Sim, ele pula linha", "Não, ele é um elemento inline", "Sim, ele centraliza o texto", "Não, ele some no navegador"], a: 1 },
        { q: "O que é o GitHub?", o: ["Uma linguagem de programação", "Um editor de código", "Uma plataforma de hospedagem de código e controle de versão", "Um banco de dados SQL"], a: 2 },
        { q: "Qual o comando inicial para criar um repositório Git local?", o: ["git push", "git commit", "git init", "git start"], a: 2 },
        { q: "Como chamamos o envio de arquivos do computador para o GitHub?", o: ["Pull", "Commit", "Push", "Merge"], a: 2 },
        { q: "O que é o GitHub Pages?", o: ["Uma página de suporte do GitHub", "Um serviço para hospedar sites estáticos diretamente do repositório", "Uma rede social para desenvolvedores", "Um editor de Markdown"], a: 1 },
        { q: "Qual o nome do arquivo principal que o GitHub Pages procura para carregar o site?", o: ["main.html", "home.html", "index.html", "app.html"], a: 2 },
        { q: "Para publicar no GitHub Pages, em qual aba das configurações (Settings) devemos ir?", o: ["Actions", "Security", "Pages", "Webhooks"], a: 2 },
        { q: "O que significa o conceito de 'Repository' (Repositório) no GitHub?", o: ["Um disco rígido físico", "Um local onde os arquivos e o histórico do projeto são armazenados", "Um tipo de vírus", "Uma senha de acesso"], a: 1 },
        { q: "Qual tag é ideal para destacar uma palavra dentro de um parágrafo sem pular linha?", o: ["div", "span", "p", "section"], a: 1 },
        { q: "No CSS, como selecionamos uma DIV com id='menu'?", o: [".menu", "#menu", "div.menu", "*menu"], a: 1 },
        { q: "Qual o link padrão gerado pelo GitHub Pages (geralmente)?", o: ["github.com/usuario/projeto", "usuario.github.io/projeto", "projeto.pages.dev", "www.site.com"], a: 1 }
    ];

    let currentQuestion = 0;
    let score = 0;
    let studentName = "";
    let startTime = "";

    function startQuiz() {
        studentName = document.getElementById('student-name').value;
        if (!studentName) {
            alert("Por favor, insira seu nome.");
            return;
        }
        startTime = new Date().toLocaleString('pt-BR');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestion];
        document.getElementById('quiz-header').innerText = `Questão ${currentQuestion + 1} de ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        q.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            container.appendChild(btn);
        });
    }

    function checkAnswer(choice) {
        const q = questions[currentQuestion];
        const buttons = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');
        
        buttons.forEach(b => b.disabled = true);

        if (choice === q.a) {
            score++;
            buttons[choice].classList.add('correct');
            feedback.innerText = "Excelente! Resposta correta.";
            feedback.className = "correct";
        } else {
            buttons[choice].classList.add('wrong');
            buttons[q.a].classList.add('correct');
            feedback.innerText = "Ops! A resposta correta era: " + q.o[q.a];
            feedback.className = "wrong";
        }

        feedback.style.display = "block";
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        
        const errors = questions.length - score;
        const endTime = new Date().toLocaleString('pt-BR');

        document.getElementById('result-summary').innerHTML = `
            <p><strong>Estudante:</strong> ${studentName}</p>
            <p><strong>Início:</strong> ${startTime}</p>
            <p><strong>Conclusão:</strong> ${endTime}</p>
            <p style="font-size: 1.5rem; margin: 10px 0;">Nota: ${(score / questions.length * 10).toFixed(1)}</p>
        `;
        
        document.getElementById('correct-count').innerText = score;
        document.getElementById('error-count').innerText = errors;
    }
</script>

</body>
</html>
